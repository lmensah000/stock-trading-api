# Simple Logger Preferences
spring.main.banner-mode=off
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/moneyteam.log
logging.file.path=logs

# Disable showing absolute users directories in logs
logging.exception-conversion-word=%replace(%xThrowable){'(/Users/[^\\s]*)','[PRIVATE_DIR]'}
# MySQL Configuration
#spring.application.name=herovault
# Host and port come from the environment so the same build runs against a
# local MySQL and against the Compose service, where the host is the service
# name rather than loopback. The defaults reproduce the previous hardcoded
# value, so running outside Docker is unchanged.
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:moneyteamdb}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# === Server Port ===
server.port=8080

# === Actuator ===
# Health only. The full actuator surface exposes environment, beans, mappings
# and config props, which would leak internals and partially defeat the error
# hygiene elsewhere in this file. Compose needs a real readiness signal, and
# health is the whole reason actuator is on the classpath.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- JPA / Hibernate ---
# SQL echoing and bind-parameter logging are OFF by default and enabled only in
# the dev profile: bind values include passwords and PII, so they must never be
# written to logs in a deployed environment.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Flyway owns the schema. Hibernate only validates against it, in every
# profile - not just prod - so entity/schema drift fails fast in dev too
# rather than surfacing as a runtime query error.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.storage_engine=innodb
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Profile is chosen by the deployment environment (SPRING_PROFILES_ACTIVE),
# not hardcoded here. Falls back to dev for local runs.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# === JWT ===
# Must be supplied by the environment; at least 32 bytes. Startup fails otherwise.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl-ms=900000
app.jwt.refresh-token-ttl-ms=604800000

# === Auth throttling ===
app.security.login.max-attempts=5
app.security.login.lock-minutes=15
app.security.rate-limit.capacity=20
app.security.rate-limit.refill-minutes=1

# ?????????????????????????????
#  HIKARI CONNECTION POOL
# ?????????????????????????????
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# === Bot ===
# Disabled by default. While false nothing scans, nothing is seeded, and no
# order is placed - a fresh checkout and the test suite must not start trading
# because someone ran the app.
app.bot.enabled=${BOT_ENABLED:false}

# The single account the bot acts as. Identity is resolved from this at
# startup and never from a request, so the authorization invariant holds with
# no caller-supplied user id anywhere. The user must already be registered;
# the app will not create them, because that would mean choosing a password
# for them and a password chosen here is a default credential.
app.bot.owner-username=${BOT_OWNER_USERNAME:}

# What the paper account starts with.
app.bot.starting-equity=${BOT_STARTING_EQUITY:100000}

# Which broker the bot places orders through.
#   in-memory    : fills immediately at the intended price. No account needed.
#                  Useless for judging a strategy, right for testing plumbing.
#   alpaca-paper : Alpaca's paper host. Needs PAPER keys.
# There is deliberately no live option. Alpaca issues separate credentials per
# environment, so a paper key is refused by the live host - real money is out
# of reach both because nothing is configured for it and because these keys
# would not work there.
app.bot.broker=${BOT_BROKER:in-memory}

# Alpaca PAPER credentials. No defaults on purpose.
# Generate at alpaca.markets. Never put live keys here.
app.bot.alpaca.key-id=${APCA_API_KEY_ID:}
app.bot.alpaca.secret-key=${APCA_API_SECRET_KEY:}

# Tickers the bot scans, comma-separated. Empty means it scans nothing.
app.bot.universe=${BOT_UNIVERSE:}

# Percentage of equity risked per trade, and the move that triggers a signal.
app.bot.risk-percent=${BOT_RISK_PERCENT:1}
app.bot.threshold-percent=${BOT_THRESHOLD_PERCENT:4}

# How often to scan, and how often to poll for fills. The initial delay keeps
# the first pass out of startup, so a failing scan cannot look like a boot
# failure.
app.bot.scan-interval-ms=${BOT_SCAN_INTERVAL_MS:900000}
app.bot.reconcile-interval-ms=${BOT_RECONCILE_INTERVAL_MS:60000}
app.bot.initial-delay-ms=${BOT_INITIAL_DELAY_MS:60000}

# The paper equity that must be reached before live trading can even be armed.
# Required on first boot and recorded immutably: the gate is worthless if the
# bar can be quietly lowered on the evening it would have stopped a trade.
# Deliberately has no default - this is a number to choose on purpose.
app.bot.unlock-target-equity=${BOT_UNLOCK_TARGET_EQUITY:}

# === Market data ===
# in-memory by default so a fresh checkout and the tests run without
# credentials.
#   in-memory : fixtures
#   csv       : bar files on disk, for backtesting - needs no credentials,
#               which is why it is the one usable today
#   schwab    : live; only once the compromised credentials are rotated
app.marketdata.provider=${MARKETDATA_PROVIDER:in-memory}

# Where the csv provider looks for <TICKER>_<TIMEFRAME>.csv files. Mounted
# read-only into the container at /app/data by docker-compose.
app.marketdata.csv.directory=${MARKETDATA_CSV_DIR:data}

# AES-256 key (base64, 32 bytes) protecting the stored refresh token.
# Required only when the provider is "schwab".
app.marketdata.token-encryption-key=${TOKEN_ENCRYPTION_KEY:}

# Schwab credentials come from the environment and have no defaults on purpose.
#
# WARNING: the client_id and client_secret previously committed to this
# repository remain in its git history and must be treated as compromised.
# Do not populate these with those values - issue new ones at the Schwab
# developer portal first.
app.marketdata.schwab.base-url=${SCHWAB_BASE_URL:https://api.schwabapi.com}
app.marketdata.schwab.token-url=${SCHWAB_TOKEN_URL:https://api.schwabapi.com/v1/oauth/token}
app.marketdata.schwab.client-id=${SCHWAB_CLIENT_ID:}
app.marketdata.schwab.client-secret=${SCHWAB_CLIENT_SECRET:}
app.marketdata.schwab.redirect-uri=${SCHWAB_REDIRECT_URI:}
app.marketdata.schwab.request-timeout-seconds=20

# === Resilience around outbound market-data calls ===
# The published rate limit is not well documented, so this is deliberately
# conservative and tunable rather than a hardcoded guess.
resilience4j.ratelimiter.instances.schwabMarketData.limit-for-period=100
resilience4j.ratelimiter.instances.schwabMarketData.limit-refresh-period=60s
resilience4j.ratelimiter.instances.schwabMarketData.timeout-duration=30s

resilience4j.retry.instances.schwabMarketData.max-attempts=4
resilience4j.retry.instances.schwabMarketData.wait-duration=1s
resilience4j.retry.instances.schwabMarketData.enable-exponential-backoff=true
resilience4j.retry.instances.schwabMarketData.exponential-backoff-multiplier=2
# Jitter so a universe scan does not retry in lockstep and re-create the burst
# that triggered the rate limit in the first place.
resilience4j.retry.instances.schwabMarketData.enable-randomized-wait=true
resilience4j.retry.instances.schwabMarketData.randomized-wait-factor=0.5
resilience4j.retry.instances.schwabMarketData.retry-exceptions=com.moneyteam.marketdata.provider.schwab.client.SchwabApiException

# === Alpaca ===
# The free tier allows 200 requests a minute across historical data calls, so
# this limiter is load-bearing rather than decorative: a universe scan without
# it converts throughput into 429s. Set below the published ceiling to leave
# room for the trading calls, which share the account's budget.
resilience4j.ratelimiter.instances.alpacaMarketData.limit-for-period=150
resilience4j.ratelimiter.instances.alpacaMarketData.limit-refresh-period=60s
resilience4j.ratelimiter.instances.alpacaMarketData.timeout-duration=30s

resilience4j.ratelimiter.instances.alpacaBroker.limit-for-period=50
resilience4j.ratelimiter.instances.alpacaBroker.limit-refresh-period=60s
resilience4j.ratelimiter.instances.alpacaBroker.timeout-duration=30s

resilience4j.retry.instances.alpacaMarketData.max-attempts=4
resilience4j.retry.instances.alpacaMarketData.wait-duration=1s
resilience4j.retry.instances.alpacaMarketData.enable-exponential-backoff=true
resilience4j.retry.instances.alpacaMarketData.exponential-backoff-multiplier=2
resilience4j.retry.instances.alpacaMarketData.enable-randomized-wait=true
resilience4j.retry.instances.alpacaMarketData.randomized-wait-factor=0.5
resilience4j.retry.instances.alpacaMarketData.retry-exceptions=com.moneyteam.bot.broker.alpaca.AlpacaApiException

# Reads only. Order placement is deliberately NOT retried - see AlpacaBroker:
# retrying an order whose response was lost is how one intended position
# becomes two.
resilience4j.retry.instances.alpacaBroker.max-attempts=3
resilience4j.retry.instances.alpacaBroker.wait-duration=1s
resilience4j.retry.instances.alpacaBroker.enable-exponential-backoff=true
resilience4j.retry.instances.alpacaBroker.enable-randomized-wait=true
resilience4j.retry.instances.alpacaBroker.retry-exceptions=com.moneyteam.bot.broker.alpaca.AlpacaApiException

resilience4j.circuitbreaker.instances.alpacaMarketData.sliding-window-size=20
resilience4j.circuitbreaker.instances.alpacaMarketData.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.alpacaMarketData.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.alpacaMarketData.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.alpacaBroker.sliding-window-size=10
resilience4j.circuitbreaker.instances.alpacaBroker.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.alpacaBroker.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.alpacaBroker.permitted-number-of-calls-in-half-open-state=2

resilience4j.circuitbreaker.instances.schwabMarketData.sliding-window-size=20
resilience4j.circuitbreaker.instances.schwabMarketData.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.schwabMarketData.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.schwabMarketData.permitted-number-of-calls-in-half-open-state=3
