# ============================================================
#  DEV PROFILE
#  Verbose SQL is acceptable here because this profile is for local
#  development only. Never activate it against production data - the binder
#  logging below prints every SQL bind value, including credentials and PII.
# ============================================================

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.moneyteam=DEBUG

# A default dev secret so the app starts locally without extra setup.
# Production supplies its own via JWT_SECRET and must never use this value.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-32b!}
