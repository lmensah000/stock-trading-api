# ============================================================
#  PRODUCTION PROFILE
#  No SQL echoing, no bind-parameter logging, no debug output.
#  Every secret comes from the environment.
# ============================================================

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.root=INFO
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.moneyteam=INFO

# Schema is managed deliberately, never auto-mutated at startup.
spring.jpa.hibernate.ddl-auto=validate

# Do not leak stack traces or internal messages in error responses.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
