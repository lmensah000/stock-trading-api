# Test profile. The datasource is supplied per-test by Testcontainers via
# @DynamicPropertySource; nothing here should point at a real database.
spring.jpa.show-sql=false
logging.level.org.hibernate=WARN
logging.level.org.flywaydb=INFO
# Generated at context startup rather than written here. A test context needs
# a key long enough for HS256, never a particular one, and a literal that looks
# like a secret is what a scanner flags - which matters because a repository
# whose alerts are mostly false positives is one where a real alert gets waved
# through. Each ${random.value} is 32 hex characters, so two comfortably clear
# the 32-byte minimum JwtTokenProvider enforces.
app.jwt.secret=${random.value}${random.value}
